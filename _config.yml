# Site settings
title: En Veille
logo: "/images/logo.svg"
og_image: /images/og-card.png
# Repli si un billet est publié avant un passage de generate-posts.py : sa
# cellule garde une image plutôt que de casser l'alignement de la rangée.
teaser: /images/og-card.png
email: vincent.ferries@gmail.com
description: >-
  Vincent Ferries, développeur indépendant basé à Toulouse. Accompagnement
  d'équipes tech, architecture, IA dans le dev. Billets de veille depuis 2011.
twitter_username: VincentFERRIES
github_username: vferries

# Minimal Mistakes lit `twitter.username` imbriqué, pas le `twitter_username`
# à plat de la convention Jekyll : sans ce bloc, seo.html n'émet aucune balise
# twitter:* sur les pages du thème et X rend nos cartes 1200×630 en vignette
# carrée. La landing, elle, pose ses balises en dur dans son layout.
twitter:
  username: VincentFERRIES
minimal_mistakes_skin: default
search: true
# Liste vide mais présente : elle remplace le main.min.js du thème (jQuery +
# plugins tous morts ici — SmoothScroll neutralisé par nav.js, GreedyNav sans
# cible depuis le shadow masthead, MagnificPopup/Gumshoe/FitVids sans
# consommateur, FitVids remplacé par une règle aspect-ratio d'enveille.css).
# Le toggle de recherche vit dans nav.js, le câblage lunr dans ev-search.js,
# chargés au premier clic sur la loupe.
footer_scripts: []
# jekyll-feed plafonne à 10 billets par défaut — servir tout l'historique
feed:
  posts_limit: 50

# Build settings
markdown:    kramdown
remote_theme: mmistakes/minimal-mistakes@4.28.0
# Outputting
permalink: /:categories/:title/
paginate: 12 # amount of posts to show on /blog/
paginate_path: /blog/page:num/
timezone: Europe/Paris

include:
  - _pages

# Fichiers à ne pas processer par Jekyll (docs projet, contexte Claude, etc.)
exclude:
  - AGENTS.md
  - CLAUDE.md
  - CLAUDE.local.md
  - NEXT.md
  - README.md
  - .claude
  - docs
  # node_modules à la racine n'est jamais légitime : le seul qui l'est vit sous
  # tools/, déjà exclu ci-dessous. Celui-ci n'apparaît que par accident (npx
  # lancé depuis la racine) — l'ignorer ne suffit pas, il faut aussi l'exclure
  # du build sinon Jekyll le recopie dans _site.
  - node_modules
  - tools
  - vendor
  - Gemfile
  - Gemfile.lock

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Site owner
author:
  name: Vincent Ferries
  # Variante 220px dédiée (affichée 110px max par MM) — profile_square.jpg
  # (800px, 69 Ko) reste la source de la photo .ev-photo de la landing
  avatar: /images/profile_avatar.jpg
  bio: "Dev indé · JVM · JS/TS · Android · IA dans le dev · Toulouse"
  links:
    - label: "Services"
      icon: "fa fa-fw fa-briefcase"
      url: "/#services"
    - label: "CV"
      icon: "fa fa-fw fa-user"
      url: "https://vferries.github.io/cv/"
    - label: "Email"
      icon: "fa fa-fw fa-envelope-square"
      url: "mailto:vincent.ferries@gmail.com"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://x.com/VincentFERRIES"
    - label: "Github"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/vferries"
    - label: "Twitch"
      icon: "fab fa-fw fa-twitch"
      url: "https://www.twitch.tv/EnVeilleCode"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

comments:
  provider: "disqus"
  disqus:
    shortname: "blogvincent"

# BCP 47 (tiret) : c'est la clé de _data/ui-text.yml du thème. Avec fr_FR le
# lookup site.data.ui-text[locale] rendait nil et toute l'UI tombait en anglais.
# og:locale (underscore) et <html lang> sont normalisés par le thème.
locale:           fr-FR
url:              https://www.enveille.info
