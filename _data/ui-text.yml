# Chaînes d'interface du thème Minimal Mistakes, en français.
#
# Pourquoi ce fichier existe : Jekyll ne lit `_data/` que depuis la source du
# site, jamais depuis un thème (DataReader#read → site.in_source_dir). Le
# `_data/ui-text.yml` livré par le thème n'est donc jamais chargé sous
# `remote_theme`, et toutes les chaînes retombaient sur leur `default:` anglais.
#
# Copie conforme du bloc `fr` de mmistakes/minimal-mistakes@4.28.0, aplati sous
# la clé `fr-FR` (la locale du site). Les valeurs vides sont celles d'upstream :
# elles laissent volontairement jouer le `default:` du template.
#
# À rejouer à chaque bump de `remote_theme` (cf. NEXT.md).

