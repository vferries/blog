<!DOCTYPE html>
<html lang="{{ site.locale | default: 'fr-FR' | replace: '_', '-' }}" dir="ltr" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sans JS, les .ev-reveal doivent rester visibles (cf. landing.css html:not(.js)) -->
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <!-- site.locale est en BCP 47 (fr-FR) ; OpenGraph veut un underscore -->
  <meta property="og:locale" content="{{ site.locale | default: 'fr-FR' | replace: '-', '_' }}">
  <meta property="og:image" content="{{ page.og_image | default: '/images/og-card.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ page.og_image | default: '/images/og-card.png' | absolute_url }}">

  {% include head/ev-assets.html %}
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">

  {% feed_meta %}
</head>
<body class="landing">
  <a class="ev-skip-link" href="#main">Aller au contenu</a>

  {{ content }}

  <script defer src="{{ '/assets/js/landing.js' | relative_url }}"></script>
</body>
</html>
